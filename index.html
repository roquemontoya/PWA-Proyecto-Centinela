<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centinela 2.0</title>
    <link rel="stylesheet" href="style.css">
    <!-- Estilos de Leaflet para los mapas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Motor de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Barra Superior -->
    <header class="app-header">
        <div class="header-title">
            <span class="logo-icon"><img src="img/bomberos.png" style="width: 24px; vertical-align: middle;"></span>
            <h1>Centinela 2.0</h1>
        </div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </header>

    <!-- Menú Desplegable Limpio (Solo categorías) -->
    <nav id="side-menu" class="side-drawer">
        <div class="drawer-header">
            <span>🛡️ Módulos de Red</span>
            <button onclick="toggleMenu()" class="close-menu">&times;</button>
        </div>
        <ul class="drawer-list">
            <li onclick="cargarModulo('ecas')"><img src="img/ecas.png" style="width: 20px; vertical-align: middle; margin-right: 8px;"> ECAS</li>
            <li onclick="cargarModulo('extintores')"><img src="img/extintores.png" style="width: 20px; vertical-align: middle; margin-right: 8px;"> Extintores</li>
            <li onclick="cargarModulo('hidrantes')"><img src="img/hidrantes.png" style="width: 20px; vertical-align: middle; margin-right: 8px;"> Hidrantes</li>
            <li onclick="cargarModulo('valvulas')"><img src="img/valvulas.png" style="width: 20px; vertical-align: middle; margin-right: 8px;"> Válvulas</li>
            <li onclick="cargarModulo('bomberos')"><img src="img/bomberos.png" style="width: 20px; vertical-align: middle; margin-right: 8px;"> Personal / Bomberos</li>
            <li onclick="cargarModulo('ipp')"><img src="img/ipp.png" style="width: 20px; vertical-align: middle; margin-right: 8px;"> IPP</li>
            <li onclick="cargarModulo('pecas')"><img src="img/pecas.png" style="width: 20px; vertical-align: middle; margin-right: 8px;"> PECAS</li>
            <li onclick="cargarModulo('vecas')"><img src="img/vecas.png" style="width: 20px; vertical-align: middle; margin-right: 8px;"> VECAS</li>
        </ul>
    </nav>
    <div id="drawer-overlay" class="overlay" onclick="toggleMenu()"></div>

    <!-- Pantalla Principal: Tarjetas con Fotos Reales -->
    <main id="main-content" class="dashboard-grid">
        <div class="card" onclick="cargarModulo('hidrantes')">
            <div class="card-img"><img src="img/hidrantes.png" alt="Hidrantes"></div>
            <div class="card-title">Hidrantes</div>
        </div>
        <div class="card" onclick="cargarModulo('extintores')">
            <div class="card-img"><img src="img/extintores.png" alt="Extintores"></div>
            <div class="card-title">Extintores</div>
        </div>
        <div class="card" onclick="cargarModulo('ecas')">
            <div class="card-img"><img src="img/ecas.png" alt="ECAS"></div>
            <div class="card-title">ECAS</div>
        </div>
        <div class="card" onclick="cargarModulo('valvulas')">
            <div class="card-img"><img src="img/valvulas.png" alt="Válvulas"></div>
            <div class="card-title">Válvulas</div>
        </div>
        <div class="card" onclick="cargarModulo('vecas')">
            <div class="card-img"><img src="img/vecas.png" alt="VECAS"></div>
            <div class="card-title">VECAS</div>
        </div>
        <div class="card" onclick="cargarModulo('pecas')">
            <div class="card-img"><img src="img/pecas.png" alt="PECAS"></div>
            <div class="card-title">PECAS</div>
        </div>
        <div class="card" onclick="cargarModulo('bomberos')">
            <div class="card-img"><img src="img/bomberos.png" alt="Bomberos"></div>
            <div class="card-title">Personal / Bomberos</div>
        </div>
        <div class="card" onclick="cargarModulo('ipp')">
            <div class="card-img"><img src="img/ipp.png" alt="IPP"></div>
            <div class="card-title">IPP</div>
        </div>
    </main>

    <!-- Contenedor dinámico para mapas -->
    <div id="vista-dinamica" class="dynamic-container" style="display: none;"></div>

    <!-- Barra Inferior INICIO -->
    <footer class="bottom-nav" onclick="irInicio()">
        <div class="nav-item">
            <span>🏠</span>
            <span>INICIO</span>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
