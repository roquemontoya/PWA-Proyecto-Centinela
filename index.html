<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centinela 2.0</title>
    <link rel="stylesheet" href="style.css">
    <!-- Estilos de Leaflet para los mapas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Motor de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Barra Superior -->
    <header class="app-header">
        <div class="header-title">
            <span class="logo-icon">🛡️</span>
            <h1>Centinela 2.0</h1>
        </div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </header>

    <!-- Menú Desplegable Limpio (Solo categorías) -->
    <nav id="side-menu" class="side-drawer">
        <div class="drawer-header">
            <span>🛡️ Módulos de Red</span>
            <button onclick="toggleMenu()" class="close-menu">&times;</button>
        </div>
        <ul class="drawer-list">
            <li onclick="cargarModulo('ecas')">📋 ECAS</li>
            <li onclick="cargarModulo('extintores')">🧯 Extintores</li>
            <li onclick="cargarModulo('hidrantes')">🚰 Hidrantes</li>
            <li onclick="cargarModulo('valvulas')">⚙️ Válvulas</li>
            <li onclick="cargarModulo('bomberos')">👨‍🚒 Personal / Bomberos</li>
            <li onclick="cargarModulo('ipp')">📦 IPP</li>
            <li onclick="cargarModulo('pecas')">🔧 PECAS</li>
            <li onclick="cargarModulo('vecas')">⚙️ VECAS</li>
        </ul>
    </nav>
    <div id="drawer-overlay" class="overlay" onclick="toggleMenu()"></div>

    <!-- Pantalla Principal: Tarjetas con Fotos Reales -->
    <main id="main-content" class="dashboard-grid">
        <div class="card" onclick="cargarModulo('hidrantes')">
            <div class="card-img"><img src="img/hidrantes.jpg" alt="Hidrantes" onerror="this.parentElement.innerHTML='🚰';"></div>
            <div class="card-title">Hidrantes</div>
        </div>
        <div class="card" onclick="cargarModulo('extintores')">
            <div class="card-img"><img src="img/extintores.jpg" alt="Extintores" onerror="this.parentElement.innerHTML='🧯';"></div>
            <div class="card-title">Extintores</div>
        </div>
        <div class="card" onclick="cargarModulo('ecas')">
            <div class="card-img"><img src="img/ecas.jpg" alt="ECAS" onerror="this.parentElement.innerHTML='📋';"></div>
            <div class="card-title">ECAS</div>
        </div>
        <div class="card" onclick="cargarModulo('valvulas')">
            <div class="card-img"><img src="img/valvulas.jpg" alt="Válvulas" onerror="this.parentElement.innerHTML='⚙️';"></div>
            <div class="card-title">Válvulas</div>
        </div>
        <div class="card" onclick="cargarModulo('vecas')">
            <div class="card-img"><img src="img/vecas.jpg" alt="VECAS" onerror="this.parentElement.innerHTML='⚙️';"></div>
            <div class="card-title">VECAS</div>
        </div>
        <div class="card" onclick="cargarModulo('pecas')">
            <div class="card-img"><img src="img/pecas.jpg" alt="PECAS" onerror="this.parentElement.innerHTML='🔧';"></div>
            <div class="card-title">PECAS</div>
        </div>
        <div class="card" onclick="cargarModulo('bomberos')">
            <div class="card-img"><img src="img/bomberos.jpg" alt="Bomberos" onerror="this.parentElement.innerHTML='👨‍🚒';"></div>
            <div class="card-title">Personal / Bomberos</div>
        </div>
        <div class="card" onclick="cargarModulo('ipp')">
            <div class="card-img"><img src="img/ipp.jpg" alt="IPP" onerror="this.parentElement.innerHTML='📦';"></div>
            <div class="card-title">IPP</div>
        </div>
    </main>

    <!-- Contenedor dinámico para mapas -->
    <div id="vista-dinamica" class="dynamic-container" style="display: none;"></div>

    <!-- Barra Inferior INICIO -->
    <footer class="bottom-nav" onclick="irInicio()">
        <div class="nav-item">
            <span>📋</span>
            <span>INICIO</span>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
